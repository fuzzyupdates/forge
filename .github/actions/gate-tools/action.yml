name: gate-tools
description: >-
  Install the pinned style-gate toolchain. The installer is
  scripts/ci-install-tools.sh — the same script contributors run, and itself
  covered by the gate (shellcheck/shfmt), unlike an inline composite run body.
runs:
  using: composite
  steps:
    - run: bash scripts/ci-install-tools.sh
      shell: bash
