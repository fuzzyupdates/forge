name: Publish Images

on:
  push:
    branches: ["main"]
    paths: ["images/**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# serialize publishes; a RUNNING publish is never cancelled (a queued one can
# still be replaced by a newer push — for Caddy images the tip version is the
# one that matters, and VERSION-tagged pushes keep history)
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  gate:
    # run the full check.sh gate before anything publishes — publish runs on
    # push events too, so a direct merge to main must not skip the gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned gate tools
        uses: ./.github/actions/gate-tools
      - name: Style gate
        run: ./check.sh

  build-and-push:
    # publish ONLY from main. This ref check stops an accidental
    # workflow_dispatch against another branch; it is NOT a defense against a
    # malicious pusher — a pushed workflow file runs with the permissions its
    # own `permissions:` block asks for. See the trust model in
    # docs/CONTRIBUTING.md.
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image_name: [caddy-cloudflare]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read version and prep metadata
        id: prep
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          echo "VERSION=$(tr -d '[:space:]' <"images/$IMAGE_NAME/VERSION")" >> "$GITHUB_OUTPUT"
          echo "REPO_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load (no push — verify the exact artifact before it lands in the registry)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./images/${{ matrix.image_name }}
          build-args: |
            CADDY_VERSION=${{ steps.prep.outputs.VERSION }}
          push: false
          load: true
          tags: forge-publish-verify:${{ matrix.image_name }}

      - name: Verify the loaded artifact
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          EXPECTED: ${{ steps.prep.outputs.VERSION }}
        run: |
          set -euo pipefail
          out=$(docker run --rm --entrypoint caddy "forge-publish-verify:$IMAGE_NAME" version)
          printf '%s\n' "$out"
          first=$(head -n1 <<<"$out" | awk '{print $1}')
          if [[ "$first" != "v$EXPECTED" ]]; then
            echo "built binary reports '$first', want 'v$EXPECTED'" >&2
            exit 1
          fi
          mods=$(docker run --rm --entrypoint caddy "forge-publish-verify:$IMAGE_NAME" list-modules)
          grep -qxF 'dns.providers.cloudflare' <<<"$mods"

      - name: Push the verified artifact
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          VERSION: ${{ steps.prep.outputs.VERSION }}
          REPO_LC: ${{ steps.prep.outputs.REPO_LC }}
        run: |
          set -euo pipefail
          # tag and push the exact loaded artifact — a second build-push would
          # publish a fresh build, not the one that was verified
          src="forge-publish-verify:$IMAGE_NAME"
          dst="$REGISTRY/$REPO_LC/forge/$IMAGE_NAME"
          docker tag "$src" "$dst:$VERSION"
          docker tag "$src" "$dst:latest"
          # version tag first: if a push fails mid-way, :latest never points
          # at content that lacks its version tag
          docker push "$dst:$VERSION"
          docker push "$dst:latest"
