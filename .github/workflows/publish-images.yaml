name: Publish Images

on:
  push:
    branches: ["main"]
    paths: ["images/**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# serialize publishes; a queued push must never be cancelled mid-flight
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  build-and-push:
    # publish ONLY from main — this also blocks workflow_dispatch against an
    # unreviewed branch, which would otherwise overwrite :latest with
    # unreviewed content
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image_name: [caddy-cloudflare]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read version and prep metadata
        id: prep
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          echo "VERSION=$(tr -d '[:space:]' <"images/$IMAGE_NAME/VERSION")" >> "$GITHUB_OUTPUT"
          echo "REPO_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push:false — verify before anything lands in the registry)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./images/${{ matrix.image_name }}
          build-args: |
            CADDY_VERSION=${{ steps.prep.outputs.VERSION }}
          push: false
          load: true
          tags: forge-publish-verify:${{ matrix.image_name }}

      - name: Verify built binary reports the pinned version
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          EXPECTED: ${{ steps.prep.outputs.VERSION }}
        run: |
          set -euo pipefail
          out=$(docker run --rm --entrypoint caddy "forge-publish-verify:$IMAGE_NAME" version)
          printf '%s\n' "$out"
          first=$(head -n1 <<<"$out" | awk '{print $1}')
          if [[ "$first" != "v$EXPECTED" ]]; then
            echo "built binary reports '$first', want 'v$EXPECTED'" >&2
            exit 1
          fi

      - name: Push (layers come from the verified build's cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./images/${{ matrix.image_name }}
          build-args: |
            CADDY_VERSION=${{ steps.prep.outputs.VERSION }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.REPO_LC }}/forge/${{ matrix.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.REPO_LC }}/forge/${{ matrix.image_name }}:${{ steps.prep.outputs.VERSION }}
