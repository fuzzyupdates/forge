name: CI

on:
  pull_request:
  push:
    branches: [main]

# least-privilege: checks only read the tree; the PR build never pushes
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a superseded PR gate may cancel; a main-push gate never cancels already
  # running work, but queued runs are replaced (every "real" main commit is
  # expected to land via a checked PR, so the last run records the outcome)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned gate tools
        uses: ./.github/actions/gate-tools

      - name: Style gate
        run: ./check.sh

  detect-images:
    # The images/ directory is the single source of truth for what must build;
    # no matrix list here to drift from. Names are validated before becoming
    # matrix entries (they are later expanded into run: shell contexts).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - id: detect
        run: |
          set -euo pipefail
          names=()
          while IFS= read -r d; do
            name="${d##*/}"
            # same OCI repository-component rule check.sh enforces
            if ! [[ "$name" =~ ^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*$ ]]; then
              echo "invalid image directory name: '$name'" >&2
              exit 1
            fi
            names+=("$name")
          done < <(find images -mindepth 1 -maxdepth 1 -type d | sort)
          if [[ ${#names[@]} -eq 0 ]]; then
            echo "no image directories found under images/" >&2
            exit 1
          fi
          images=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "will build: $images"

  build:
    # PR-time proof the Dockerfiles actually build, the binary reports the
    # pinned version, and the Cloudflare DNS module is in the build. Never
    # pushes; publish-images.yaml owns publishing on main. needs: style so
    # VERSION is semver-validated before it is used.
    needs: [style, detect-images]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name: ${{ fromJSON(needs.detect-images.outputs.images) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read version
        id: prep
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: echo "VERSION=$(tr -d '[:space:]' <"images/$IMAGE_NAME/VERSION")" >> "$GITHUB_OUTPUT"

      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./images/${{ matrix.image_name }}
          build-args: |
            CADDY_VERSION=${{ steps.prep.outputs.VERSION }}
          push: false
          load: true
          tags: forge-pr-check:${{ matrix.image_name }}

      - name: Verify built binary reports the pinned version
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          EXPECTED: ${{ steps.prep.outputs.VERSION }}
        run: |
          set -euo pipefail
          out=$(docker run --rm --entrypoint caddy "forge-pr-check:$IMAGE_NAME" version)
          printf '%s\n' "$out"
          first=$(head -n1 <<<"$out" | awk '{print $1}')
          if [[ "$first" != "v$EXPECTED" ]]; then
            echo "built binary reports '$first', want 'v$EXPECTED'" >&2
            exit 1
          fi

      - name: Verify expected modules are baked in
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          set -euo pipefail
          mods=$(docker run --rm --entrypoint caddy "forge-pr-check:$IMAGE_NAME" list-modules)
          # a silently dropped DNS plugin still builds and still reports the
          # right version — the whole point of this image is the module
          grep -qx 'dns.providers.cloudflare' <<<"$mods"
